name: Update profile card
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generate.mjs, "avatar_*.jpg", .github/workflows/update-card.yml]
permissions:
  contents: write
  actions: write # lets the keep-alive step re-enable this workflow
concurrency: update-card
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node generate.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if ! git diff --staged --quiet; then
            git commit -m "Update profile card"
            git push
          fi
      # GitHub turns off schedules in public repos after 60 days without activity;
      # re-enabling the workflow on every run resets that timer.
      - name: Keep the schedule alive
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-card.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
